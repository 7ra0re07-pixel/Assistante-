name: Compiler l'APK et publier l'accueil TV

on:
  push:
    branches: [main]
    paths: ['tv-launcher/**', 'android/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: build-and-pages
  cancel-in-progress: true

jobs:
  apk:
    name: Compiler l'APK Android TV
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour publier l'APK dans la release « apk »
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compiler
        run: gradle -p android assembleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AccueilTV.apk
          cp AccueilTV.apk "AccueilTV-1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: AccueilTV.apk

      # Une release par version (v1.N), marquée « Latest » : APK avec le numéro dans le nom
      # + même fichier sous un nom fixe pour le lien « toujours la dernière version ».
      # GitHub y ajoute automatiquement le code source complet en ZIP.
      - name: Publier la release de cette version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Accueil TV 1.${{ github.run_number }}
          body: |
            Écran d'accueil Android TV, version 1.${{ github.run_number }}.
            - AccueilTV-1.${{ github.run_number }}.apk : l'appli à installer sur la TV (clé USB ou Downloader).
            - Source code (zip) : sauvegarde complète du projet (code, logos, fonds d'écran, guides).
            Dernière version, toujours au même lien : https://github.com/${{ github.repository }}/releases/latest/download/AccueilTV.apk
          files: |
            AccueilTV-1.${{ github.run_number }}.apk
            AccueilTV.apk
          make_latest: true

      # Ancien lien conservé (…/releases/download/apk/AccueilTV.apk)
      - name: Mettre à jour la release « apk »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Accueil TV (lien historique)
          body: |
            Ancien lien, toujours à jour (version 1.${{ github.run_number }}).
            Préférez : https://github.com/${{ github.repository }}/releases/latest
          files: AccueilTV.apk
          make_latest: false

  pages:
    name: Publier le site (et l'APK) sur GitHub Pages
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      # Adresse courte à taper dans Downloader : <site>/tv.apk
      - name: Ajouter l'APK au site
        run: cp apk/AccueilTV.apk tv-launcher/tv.apk

      # Lu par « Rechercher une mise à jour » dans l'appli (même numéro que l'APK)
      - name: Publier le numéro de version
        run: |
          printf '{"versionCode": %s, "versionName": "1.%s", "apk": "https://7ra0re07-pixel.github.io/Assistante-/tv.apk"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" > tv-launcher/version.json
          cat tv-launcher/version.json

      - uses: actions/configure-pages@v5
      # Nom propre à chaque tentative : une relance ne trouve pas deux archives au même nom
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tv-launcher
          name: github-pages-${{ github.run_attempt }}
      # GitHub met parfois quelques secondes à rendre l'archive du site visible
      - name: Attendre l'archive du site
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
