<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0E1A">
<meta name="referrer" content="no-referrer">
<title>Télécommande Accueil TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='5' y='1.5' width='14' height='21' rx='4' fill='%230A0E1A' stroke='%23F2F4F8' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='9' r='3' fill='%23F2F4F8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1A; --card: #121829; --card-2: #1A2136; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
    --text: #F2F4F8; --text-2: #D6DBE6; --muted: #A3ACBF; --accent: #F2F4F8; --accent-ink: #0A0E1A;
    --on: #FFC94D; --bad: #FF6B6E; --ok: #4ADE80;
    --display: 'Sora', 'Segoe UI', Roboto, system-ui, sans-serif; --font: 'Figtree', 'Segoe UI', Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { min-height: 100vh; color: var(--text); font-family: var(--font); font-size: 16px;
    background: radial-gradient(120% 70% at 80% 0%, #16223F 0%, #0A0E1A 60%) no-repeat, var(--bg);
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-family: var(--display); font-size: 22px; letter-spacing: -.02em; }
  .status { display: flex; align-items: center; font-size: 13px; color: var(--muted); }
  .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 8px; }
  .status.ok::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .status.bad::before { background: var(--bad); }
  section { margin-top: 28px; }
  h2 { font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; }
  .hidden { display: none !important; }

  /* Appairage */
  .pair { margin-top: 12vh; text-align: center; }
  .pair p { color: var(--text-2); line-height: 1.5; margin: 10px auto 28px; max-width: 320px; }
  .digits { display: flex; justify-content: center; }
  .digits input { width: 62px; height: 76px; margin: 0 6px; border-radius: 16px; border: 0; background: var(--card); color: var(--text);
    box-shadow: inset 0 0 0 1.5px var(--line-2); text-align: center; font-family: var(--display); font-size: 34px; font-weight: 700; outline: none; }
  .digits input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .pair .err { color: var(--bad); min-height: 22px; margin-top: 18px; font-weight: 600; }

  /* Pavé directionnel */
  .pad { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 6px auto 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #1C2438 0%, #121829 70%); box-shadow: inset 0 0 0 1px var(--line-2), 0 20px 50px rgba(0,0,0,.45); }
  .pad .dir { position: absolute; width: 34%; height: 34%; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--text-2); }
  .pad .dir svg { width: 34px; height: 34px; }
  .pad .up { top: 2%; left: 33%; } .pad .down { bottom: 2%; left: 33%; }
  .pad .left { left: 2%; top: 33%; } .pad .right { right: 2%; top: 33%; }
  .pad .okb { position: absolute; left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    font-family: var(--display); font-size: 22px; font-weight: 700; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
  .pad .dir:active, .pad .dir.press { background: rgba(255,255,255,.08); color: var(--text); }
  .pad .okb:active, .pad .okb.press { transform: scale(.94); }
  .row2 { display: flex; justify-content: center; margin-top: 22px; }
  .pill { display: flex; align-items: center; padding: 14px 26px; margin: 0 8px; border-radius: 40px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; }
  .pill svg { width: 22px; height: 22px; margin-right: 10px; }
  .pill:active { background: var(--card-2); }

  /* Écrire sur la TV */
  .write { padding: 16px; border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .write .target { font-size: 14px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
  .write .target b { color: var(--text); }
  .write .line { display: flex; }
  .write input { flex: 1; min-width: 0; height: 50px; padding: 0 14px; border-radius: 14px; border: 0; background: var(--bg); color: var(--text);
    box-shadow: inset 0 0 0 1.5px var(--line-2); font: inherit; font-size: 17px; outline: none; }
  .write input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .write .send { margin-left: 10px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .write .send:disabled { opacity: .4; }

  /* Applis */
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .app { display: flex; flex-direction: column; align-items: stretch; }
  .app .face { aspect-ratio: 16 / 10; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 8px 18px rgba(0,0,0,.35); }
  .app .face img { max-width: 88%; max-height: 62%; filter: brightness(0) invert(1); } /* logos en blanc : lisibles sur la couleur de l’appli */
  .app .face span { font-family: var(--display); font-weight: 700; font-size: 14px; text-align: center; color: #fff; }
  .app .name { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app:active .face { transform: scale(.95); }

  /* Maison */
  .home { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .dev { position: relative; padding: 16px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
  .dev .bulb { width: 36px; height: 36px; color: #8A94A8; }
  .dev.on { box-shadow: inset 0 0 0 1px rgba(255,201,77,.5); background: radial-gradient(circle at 34px 34px, rgba(255,201,77,.2) 0, rgba(255,201,77,0) 110px), var(--card); }
  .dev.on .bulb { color: var(--on); filter: drop-shadow(0 0 8px rgba(255,201,77,.8)); }
  .dev .dn { font-family: var(--display); font-weight: 600; font-size: 15px; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev .ds { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .dev.on .ds { color: #FFD36E; }
  .dev .spin { position: absolute; top: 16px; right: 16px; width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin 800ms linear infinite; display: none; }
  .dev.busy .spin { display: block; }
  .dev .force { display: flex; margin-top: 12px; }
  .dev .force button { flex: 1; padding: 7px 0; font-size: 12px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,.06); color: var(--text-2); }
  .dev .force button + button { margin-left: 6px; }
  .dev .force button:disabled { opacity: .35; }
  .empty { color: var(--muted); font-size: 14px; line-height: 1.5; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: calc(100% - 32px);
    padding: 12px 20px; border-radius: 30px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; text-align: center;
    opacity: 0; transition: opacity 200ms, transform 250ms; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--bad); color: #fff; }
  .notice { margin: -4px 0 18px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45;
    background: rgba(255,201,77,.12); box-shadow: inset 0 0 0 1px rgba(255,201,77,.4); color: #FFE3A3; }
  .notice b { color: #fff; }
  .foot { margin-top: 30px; text-align: center; }
  .foot button { font-size: 13px; color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header><h1>Accueil TV</h1><div class="status" id="status">Connexion…</div></header>

  <!-- Appairage -->
  <div class="pair hidden" id="pair">
    <h1>Appairer ce téléphone</h1>
    <p>Saisis le code à 4 chiffres affiché sur la TV, dans <b>Paramètres › Télécommande</b>.</p>
    <div class="digits" id="digits">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Chiffre 1">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 2">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 3">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Chiffre 4">
    </div>
    <div class="err" id="pairErr"></div>
  </div>

  <!-- Télécommande -->
  <div class="hidden" id="remote">
    <div class="notice hidden" id="notice"></div>
    <div class="pad">
      <button class="dir up" data-key="up" aria-label="Haut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="dir left" data-key="left" aria-label="Gauche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="okb" data-key="ok" aria-label="OK">OK</button>
      <button class="dir right" data-key="right" aria-label="Droite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="dir down" data-key="down" aria-label="Bas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="row2">
      <button class="pill" data-key="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Retour</button>
      <button class="pill" data-key="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
    </div>

    <section>
      <h2>Écrire sur la TV</h2>
      <form class="write" id="writeForm" autocomplete="off">
        <div class="target" id="target">Sur la TV, sélectionne un champ (clé Voice Monkey, ville…).</div>
        <div class="line">
          <input id="text" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="300" placeholder="Tape ou colle le texte">
          <button class="send" id="send" type="submit">Envoyer</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Mes applis</h2>
      <div class="apps" id="apps"></div>
    </section>

    <section>
      <h2>Maison</h2>
      <div class="home" id="home"></div>
    </section>

    <div class="foot"><button id="unpair" type="button">Oublier ce téléphone</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TOKEN_KEY = 'atv.remote.token';
  let token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }
  const saveToken = (t) => { token = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignoré */ } };

  let toastTimer = 0;
  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.classList.toggle('error', !!err); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), err ? 4000 : 2200);
  }
  function status(text, cls) { const s = $('status'); s.textContent = text; s.className = 'status ' + (cls || ''); }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* ignoré */ } };

  async function api(path, body) {
    const opt = { method: body ? 'POST' : 'GET', headers: { 'X-Token': token }, cache: 'no-store' };
    if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let r;
    try { r = await fetch(path, opt); } catch (e) { status('TV injoignable', 'bad'); throw new Error('Impossible de joindre la TV : l’appli Accueil TV est-elle ouverte ?'); }
    if (r.status === 401) { saveToken(''); showPair(); throw new Error('Ce téléphone doit être appairé de nouveau.'); }
    let j = null; try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok || !j) throw new Error((j && j.error) || 'La TV ne répond pas.');
    status('Connecté à la TV', 'ok');
    return j;
  }

  /* ----- Appairage ----- */
  const digits = [...$('digits').querySelectorAll('input')];
  function showPair() {
    $('remote').classList.add('hidden'); $('pair').classList.remove('hidden'); status('Non appairé');
    digits.forEach(d => { d.value = ''; }); setTimeout(() => digits[0].focus(), 50);
  }
  function showRemote() { $('pair').classList.add('hidden'); $('remote').classList.remove('hidden'); refresh(); }
  digits.forEach((d, i) => {
    d.addEventListener('input', () => {
      d.value = d.value.replace(/\D/g, '').slice(-1);
      if (d.value && i < 3) digits[i + 1].focus();
      const code = digits.map(x => x.value).join('');
      if (code.length === 4) pair(code);
    });
    d.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !d.value && i > 0) digits[i - 1].focus(); });
    d.addEventListener('paste', (e) => {
      const t = (e.clipboardData && e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (t.length === 4) { e.preventDefault(); t.split('').forEach((c, k) => { digits[k].value = c; }); pair(t); }
    });
  });
  async function pair(code) {
    $('pairErr').textContent = '';
    try {
      const r = await fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || 'Code incorrect.');
      saveToken(j.token); buzz(); toast('Téléphone appairé'); showRemote();
    } catch (e) {
      $('pairErr').textContent = e.message || 'Code incorrect.';
      digits.forEach(x => { x.value = ''; }); digits[0].focus();
    }
  }

  /* ----- Commandes ----- */
  let busy = 0;
  async function send(cmd, quiet) {
    try {
      busy++;
      const j = await api('/api/cmd', cmd);
      if (j.ok === false) toast(j.error || 'Commande refusée.', true);
      else if (j.info) toast(j.info);
      else if (!quiet) toast('Envoyé');
      if (j.state) render(j.state);
      return j;
    } catch (e) { toast(e.message, true); return null; }
    finally { busy--; }
  }
  // Pavé : un appui = une touche ; maintenu = répétition (comme la télécommande)
  document.querySelectorAll('[data-key]').forEach(b => {
    const key = b.dataset.key, repeat = ['up', 'down', 'left', 'right'].includes(key);
    let timer = 0, rep = 0;
    const stop = () => { clearTimeout(timer); clearInterval(rep); b.classList.remove('press'); };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); buzz(); b.classList.add('press');
      send({ type: 'key', key }, true);
      if (repeat) timer = setTimeout(() => { rep = setInterval(() => send({ type: 'key', key }, true), 180); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); send({ type: 'key', key }, true); } });
  });

  $('writeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = $('text').value;
    const j = await send({ type: 'text', text, submit: true }, true);
    if (j && j.ok !== false) { $('text').value = ''; toast('Texte envoyé à la TV'); }
  });

  /* ----- Affichage de l'état ----- */
  const BULB = '<svg class="bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="FILL"/></svg>';
  let appsSig = '';
  function render(s) {
    // service d'accessibilité / appli ouverte sur la TV
    const tv = s.tv || {}, notes = [];
    if (tv.foreground === false) notes.push('Une autre appli est ouverte sur la TV : appuie sur <b>Accueil</b> pour revenir à Accueil TV.');
    if (tv.a11y === false) notes.push('Service d’accessibilité désactivé sur la TV : <b>Accueil</b> et <b>Retour</b> ne marchent que dans Accueil TV. Pour l’activer : sur la TV, <b>Paramètres › Télécommande › Service d’accessibilité</b>.');
    $('notice').innerHTML = notes.join('<br><br>');
    $('notice').classList.toggle('hidden', !notes.length);
    // champ visé
    const f = s.field;
    $('target').innerHTML = f ? `Champ sélectionné : <b>${esc(f.label)}</b>` : 'Sur la TV, sélectionne un champ (clé Voice Monkey, ville…).';
    const t = $('text');
    const wantType = f && f.secret ? 'password' : 'text';
    if (t.type !== wantType) t.type = wantType;
    $('send').disabled = !f;

    // applis (redessinées seulement si la liste change)
    const sig = JSON.stringify(s.apps);
    if (sig !== appsSig) {
      appsSig = sig;
      $('apps').innerHTML = s.apps.length ? s.apps.map(a => {
        const c = a.c || ['#333', '#222', '#111'];
        const face = a.logo ? `<img src="/${esc(a.logo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:this.dataset.n}))" data-n="${esc(a.name)}">` : `<span>${esc(a.name)}</span>`;
        return `<button class="app" data-app="${esc(a.id)}"><div class="face" style="background:linear-gradient(135deg, ${esc(c[1] || c[0])}, ${esc(c[2] || c[0])})">${face}</div><div class="name">${esc(a.name)}</div></button>`;
      }).join('') : '<p class="empty">Aucune appli dans « Mes applis » sur la TV.</p>';
    }

    // Maison
    const h = s.home;
    if (!h.ready) {
      $('home').innerHTML = `<p class="empty">${h.key ? 'Ajoute tes appareils sur la TV' : 'Configure la clé Voice Monkey et tes appareils sur la TV'}, dans Paramètres › Maison.</p>`;
    } else {
      $('home').innerHTML = h.devices.map(d => `<div class="dev ${d.state === 'on' ? 'on' : 'off'}${d.busy ? ' busy' : ''}" data-dev="${esc(d.id)}" role="button" tabindex="0">
        ${BULB.replace('FILL', d.state === 'on' ? 'currentColor' : 'none')}<span class="spin"></span>
        <div class="dn">${esc(d.name)}</div><div class="ds">${d.busy ? 'Envoi…' : d.state === 'on' ? 'Allumée' : 'Éteinte'}</div>
        <div class="force"><button data-want="on" ${d.on ? '' : 'disabled'}>Allumer</button><button data-want="off" ${d.off ? '' : 'disabled'}>Éteindre</button></div></div>`).join('');
    }
  }
  $('apps').addEventListener('click', (e) => {
    const b = e.target.closest('[data-app]'); if (!b) return;
    buzz(); send({ type: 'app', id: b.dataset.app }, true).then(j => { if (j && j.ok !== false) toast('Ouverture sur la TV'); });
  });
  $('home').addEventListener('click', (e) => {
    const card = e.target.closest('[data-dev]'); if (!card) return;
    const want = e.target.closest('[data-want]');
    buzz(); send({ type: 'home', id: card.dataset.dev, want: want ? want.dataset.want : undefined }, true);
    setTimeout(refresh, 1500); setTimeout(refresh, 4000);
  });
  $('unpair').addEventListener('click', () => { saveToken(''); showPair(); });

  async function refresh() {
    if (!token || document.hidden || busy) return;
    try { render(await api('/api/state')); } catch (e) { /* état affiché dans la barre */ }
  }
  setInterval(refresh, 3000);
  document.addEventListener('visibilitychange', refresh);

  if (token) showRemote(); else showPair();
})();
</script>
</body>
</html>
